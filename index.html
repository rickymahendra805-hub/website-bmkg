<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitoring Cuaca BMKG</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Monitoring Cuaca BMKG</h1>
        <p>Website Monitoring Data Cuaca</p>
    </header>

    <main>

        <section class="hero">
            <h2>Selamat Datang</h2>

            <p>
                Website monitoring kondisi cuaca
                berbasis data BMKG.
            </p>

            <button onclick="tampilkanPesan()">
                Cek Sistem
            </button>
        </section>

        <section class="weather">

            <div class="card">
                <h3>Suhu</h3>
                <p id="suhu">30°C</p>
            </div>

            <div class="card">
                <h3>Kelembapan</h3>
                <p id="kelembapan">75%</p>
            </div>

            <div class="card">
                <h3>Kondisi</h3>
                <p id="kondisi">Berawan</p>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Monitoring Cuaca BMKG</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
